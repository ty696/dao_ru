/* ==========================================================
   渲染
   ========================================================== */
let currentCate = "全部";
let currentKeyword = "";

const $ = id => document.getElementById(id);

function renderCate(){
  $('cateList').innerHTML = CATEGORIES.map(c =>
    `<button class="cate-btn ${c === currentCate ? 'active' : ''}" data-cate="${c}">${c}</button>`
  ).join('');
  $('cateList').querySelectorAll('.cate-btn').forEach(btn => {
    btn.onclick = () => {
      currentCate = btn.dataset.cate;
      renderCate();
      renderProducts();
    };
  });
}

function renderProducts(){
  let list = PRODUCTS.slice();

  if(currentCate !== "全部"){
    list = list.filter(p => p.cate === currentCate);
  }
  if(currentKeyword){
    const kw = currentKeyword.toLowerCase();
    list = list.filter(p =>
      p.name.toLowerCase().includes(kw) || (p.sub||"").toLowerCase().includes(kw) || (p.brand||"").toLowerCase().includes(kw)
    );
  }

  if(list.length === 0){
    $('content').innerHTML = '<div class="empty">没有找到相关产品</div>';
    return;
  }

  const groups = {};
  list.forEach(p => {
    const b = p.brand || "其他";
    if(!groups[b]) groups[b] = [];
    groups[b].push(p);
  });

  let html = '';
  for(const brand in groups){
    html += `<div class="brand-title">${brand}</div>`;
    html += '<div class="product-list">';
    groups[brand].forEach(p => {
      html += `<div class="product-card" onclick="openDetail('${escapeAttr(brand)}','${escapeAttr(p.name)}','${escapeAttr(p.sub||"")}')">
        <div class="product-img"><div class="ph">暂无图片</div></div>
        <div class="product-info">
          <div class="p-title">${p.name}</div>
          <div class="p-sub">${p.sub || "&nbsp;"}</div>
          <div class="p-price">批发价面议</div>
        </div>
      </div>`;
    });
    html += '</div>';
  }
  $('content').innerHTML = html;
}

function escapeAttr(s){
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function openDetail(brand, name, sub){
  $('modalMain').innerHTML = '暂无图片';
  $('modalTitle').textContent = name;
  $('modalSub').textContent = (brand ? '【' + brand + '】' : '') + (sub ? '  ' + sub : '');
  $('modalPrice').innerHTML = '批发价面议 <small>实体门店专供</small>';
  $('modal').classList.add('show');
}
function closeModal(){
  $('modal').classList.remove('show');
}
$('modal').addEventListener('click', e => {
  if(e.target.id === 'modal') closeModal();
});

$('search').addEventListener('input', e => {
  currentKeyword = e.target.value.trim();
  renderProducts();
});

renderCate();
renderProducts();
</script>

</body>
</html>
